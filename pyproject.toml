[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "overrefusal-toolkit"
version = "0.1.0"
description = "A ProSafePrune toolkit for analyzing and mitigating LLM over-refusal"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = [
  "large-language-models",
  "over-refusal",
  "model-pruning",
  "llm-safety",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
]
dependencies = [
  "torch>=2.1",
  "transformers>=4.46",
  "accelerate>=0.26",
  "numpy",
  "matplotlib",
  "scikit-learn",
  "tqdm",
]

[project.urls]
Repository = "https://github.com/SparkShieldLab/OverRefusalToolkit"
Issues = "https://github.com/SparkShieldLab/OverRefusalToolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]
